<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src app:;" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>app</title>
		<link href="./app.css" rel="stylesheet" />
	</head>
	<body>
		<main>
			<pre data-display="user-agent"></pre>
			<hr />
			<pre data-display="location"></pre>
			<hr />
			<div class="group">
				<button type="button" data-click="query">query</button>
				<button type="button" data-click="mutate">mutate</button>
			</div>
			<hr />
			<div class="group">
				<button type="button" data-click="subscribe-a">subscribe a</button>
				<button type="button" data-click="unsubscribe-a" disabled>
					unsubscribe a
				</button>
			</div>
			<div class="group">
				<button type="button" data-click="subscribe-b">subscribe b</button>
				<button type="button" data-click="unsubscribe-b" disabled>
					unsubscribe b
				</button>
			</div>
			<button type="button" data-click="send-event">send event</button>
			<hr />
			<button type="button" data-click="postmessage">postmessage</button>
			<hr />
			<ul data-display="query-responses"></ul>
			<ul data-display="mutation-responses"></ul>
			<ul data-display="events-from-main-a"></ul>
			<ul data-display="events-from-main-b"></ul>
			<ul data-display="postmessages"></ul>
		</main>
		<script type="module" src="./app.mjs"></script>
	</body>
</html>
