minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
verifyDepsBeforeRun: prompt

packages:
  - apps/*
  - packages/*

catalog:
  '@types/node24': npm:@types/node@24.13.6
  electron: 44.4.5
  oxfmt: 0.70.0
  oxlint: 1.85.0
  oxlint-tsgolint: 7.0.2003
  tsdown: 0.23.0

savePrefix: ''

allowBuilds:
  lefthook: true
  nx: true
