minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
verifyDepsBeforeRun: prompt

packages:
  - apps/*
  - packages/*

catalog:
  '@types/node24': npm:@types/node@24.13.2
  electron: 44.0.0
  oxfmt: 0.65.0
  oxlint: 1.80.0
  oxlint-tsgolint: 7.0.2001
  tsdown: 0.22.14

savePrefix: ''

allowBuilds:
  lefthook: true
  nx: true
